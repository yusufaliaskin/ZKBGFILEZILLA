# ==============================================================================
# Ziraat Katılım Bankası — Edge Gateway Reverse Proxy & SSL Configuration
# ==============================================================================

upstream core_banking_cluster {
    server 10.211.50.11:8443 max_fails=3 fail_timeout=10s;
    server 10.211.50.12:8443 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name portal.ziraatkatilim.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portal.ziraatkatilim.local;

    # SSL TLS v1.3 Hardened Parameters
    ssl_certificate /etc/ssl/certs/zk_banking_bundle.crt;
    ssl_certificate_key /etc/ssl/private/zk_banking_private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;

    # Security Headers (BDDK Compliance)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Access & Error Logging
    access_log /var/log/nginx/zk_portal_access.log;
    error_log /var/log/nginx/zk_portal_error.log warn;

    location / {
        proxy_pass http://core_banking_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
